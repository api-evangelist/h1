gap:
  summary: >-
    An 82-operation, bearer-authenticated JSON API (75 v1 operations plus 7 Price Transparency v2
    operations) with no official client library in any language. The published OpenAPI 3.1.0 is complete
    enough to generate one; the missing piece is H1 publishing and supporting it.
