note: >-
  H1 publishes NO first-party client libraries for the H1 API (formerly the Ribbon Health API). Both
  GitHub organizations that belong to H1 - github.com/h1insights and the acquired brand
  github.com/ribbonhealth - resolve but carry ZERO public repositories (verified via the GitHub API on
  2026-08-15: public_repos = 0 on both). The documentation offers copy-paste request samples (Shell,
  Node, Ruby, PHP, Python) generated by the ReadMe docs platform rather than packaged SDKs. Everything
  listed below is third-party and community-maintained; none is endorsed by H1, and no `SDKs` pointer is
  asserted in apis.yml as a result.

