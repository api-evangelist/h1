- target: $.servers[0]
  description: >-
    The v2 surface is served from the host root (https://api.ribbonhealth.com) with the version in the
    path, while the v1 surface pins /v1 into the server URL. Same host, two different base conventions.
  update:
    x-apievangelist-note: >-
      v2 paths carry their own /v2 prefix; do not append /v1. Carrier identifiers here are string
      business ids from GET /v2/carriers and are NOT interchangeable with v1 carrier UUIDs.

- target: $.paths['/v2/pricing/locations/procedures'].get
  description: >-
    Flag the behavioural break from v1 that will silently change results for anyone porting code: v1
    defaulted an absent location to New York City, v2 returns 400.
  update:
    x-apievangelist-breaking-change: >-
      Location is now REQUIRED - supply `address` or both `lat` and `lng`. v1 silently defaulted to a
      New York City address; v2 returns HTTP 400.

- target: $.paths['/v2/pricing/locations/care-clusters'].get
  description: Same required-location break as the procedures search.
  update:
    x-apievangelist-breaking-change: >-
      Location is now REQUIRED - supply `address` or both `lat` and `lng`; missing, partial or
      un-geocodable input returns HTTP 400.
