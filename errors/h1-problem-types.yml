v2_notes:
  source: openapi/h1-price-transparency-v2-openapi.json
  common_400_causes:
  - Neither `address` nor both `lat` and `lng` supplied on a geo pricing search (v2 requires an explicit
    location - unlike v1, which silently defaulted to a New York City address).
  - Only one of `lat`/`lng` supplied.
  - Geocoding of the supplied `address` failed.
  - Both `carrier_id` and `plan_id` supplied (mutually exclusive).
  common_403_cause: >-
    The API key lacks the `doctors.can_price_transparency` account entitlement. A 403 on /v2/* is an
    entitlement signal, not a malformed-request signal.
  common_404_cause: Unknown `location_id` (accepts either the integer location id or the location UUID).
