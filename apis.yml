aid: h1
url: https://raw.githubusercontent.com/api-evangelist/h1/refs/heads/main/apis.yml
name: H1
kind: company
description: H1 (h1.co) is a New York City-based healthcare data and technology company, founded in 2017,
  that combines deep healthcare provider data with agentic AI to power drug development, medical and commercial
  engagement, care navigation, and provider and network intelligence for life sciences, pharma, health
  plans, and digital health organizations across the United States. Its developer-facing API is the Ribbon
  Health API (H1 acquired Ribbon Health), a proprietary REST API served over HTTPS at https://api.ribbonhealth.com
  that provides accurate, comprehensive data on healthcare providers, locations, insurances, procedures,
  price transparency, cost estimates, and insurance eligibility. Two OpenAPI 3.1 contracts are published -
  the 75-operation v1 API under /v1, and a newer 7-operation location-first Price Transparency v2 surface
  under /v2 that H1 tells new integrations to prefer over the legacy provider-first /v1/pricing endpoints.
  The API is not FHIR-based and does not expose a SMART-on-FHIR or Da Vinci PDEX Plan-Net surface; it
  authenticates with a bearer API key, has no OAuth scopes, and gates product families on per-account
  entitlement flags. It is segmented into provider, location, custom-filter, focus-area, price-transparency
  (v1 and v2), cost-estimate/eligibility, organization, reference-data, and network-analysis product
  families. Access is gated behind a request-demo / API-key sign-up rather than fully self-serve, and no
  pricing, plans, SDKs, sandbox, changelog or webhook surface is published.
