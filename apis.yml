- aid: h1:h1-price-transparency-v2-api
  name: H1 Price Transparency v2 API
  description: Location-first negotiated-rate API under /v2/* - resolve procedures, care clusters and
    carriers, then shop procedure-level and care-cluster (bundle) prices at a known facility or near an
    address / lat-lng, returned cheapest-first in a single shared response envelope. Separate from, and
    preferred over, the legacy provider-first /v1/pricing/* endpoints; gated on the
    doctors.can_price_transparency account entitlement.
  humanURL: https://ribbon.readme.io/reference/getv2procedures
  baseURL: https://api.ribbonhealth.com
  tags:
  - Price Transparency
  - Pricing
  - Care Clusters
  - Healthcare
