aid: h1
url: https://raw.githubusercontent.com/api-evangelist/h1/refs/heads/main/apis.yml
name: H1
kind: company
description: >-
  H1 (h1.co) is a New York City-based healthcare data and technology company,
  founded in 2017, that combines deep healthcare provider data with agentic AI
  to power drug development, medical and commercial engagement, care navigation,
  and provider and network intelligence for life sciences, pharma, health plans,
  and digital health organizations across the United States. Its developer-facing
  API is the Ribbon Health API (H1 acquired Ribbon Health), a proprietary REST
  API served over HTTPS at https://api.ribbonhealth.com/v1 that provides accurate,
  comprehensive data on healthcare providers, locations, insurances, procedures,
  price transparency, cost estimates, and insurance eligibility. The API is not
  FHIR-based and does not expose a SMART-on-FHIR surface; it authenticates with a
  bearer API key and is segmented into provider, location, custom-filter,
  focus-area, price-transparency, cost-estimate/eligibility, organization,
  reference-data, and network-analysis product families. Access is gated behind a
  request-demo / API-key sign-up rather than fully self-serve.
